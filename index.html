<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ایڈمن ڈیش بورڈ - سبزیوں کی قیمتیں</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase JS Client v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>مسلم ویجیٹیبل شاپ ایڈمن</h1>
            <p>روزانہ کی قیمتیں اپ ڈیٹ کریں</p>
        </header>

        <main id="admin-main">
            <!-- لا�� ان پینل -->
            <div id="login-panel" class="auth-card">
                <h3>ایڈمن لاگ ان</h3>
                <form onsubmit="checkPassword(event)">
                    <input type="password" id="admin-pass" placeholder="پاس ورڈ درج کریں" required>
                    <button type="submit">لاگ ان</button>
                </form>
                <p id="login-error" class="error-text" style="color: red;"></p>
            </div>

            <!-- ڈیش بورڈ پینل -->
            <div id="dashboard-panel" style="display: none;">
                <h2>قیمتوں کا مینیجر</h2>
                <div id="admin-list">
                    <p class="loading-text">ڈیٹا لوڈ ہو رہا ہے...</p>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>

</body>
</html>
