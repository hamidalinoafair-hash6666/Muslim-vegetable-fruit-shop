DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Update Prices</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://jsdelivr.net"></script>
</head>
<body>
    <header>
        <h1>Muslim Vegetable Shop Admin</h1>
        <p>Update Daily Vegetable Prices</p>
    </header>

    <main id="admin-main">
        <!-- Secure Password Login Panel Layout -->
        <div id="login-panel" class="auth-card">
            <h3>Secure Admin Login</h3>
            <input type="password" id="admin-pass" placeholder="Enter Secure Password">
            <button onclick="checkPassword()">Login</button>
            <p id="login-error" class="error-text"></p>
        </div>

        <!-- Dashboard Layout, initially hidden -->
        <div id="dashboard-panel" style="display: none;">
            <h2>Daily Price Manager</h2>
            <div id="admin-list">
                <p>Loading records...</p>
            </div>
        </div>
    </main>

    <script>
        // REPLACE WITH YOUR ACTUAL SUPABASE DETAILS
        const SUPABASE_URL = "YOUR_SUPABASE_URL";
        const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Simple secure dashboard access check 
        function checkPassword() {
            const pass = document.getElementById('admin-pass').value;
            // Set your own desired password here
            if (pass === "Khanewal786") { 
                document.getElementById('login-panel').style.display = 'none';
                document.getElementById('dashboard-panel').style.display = 'block';
                loadAdminPanel();
            } else {
                document.getElementById('login-error').innerText = "Incorrect Password! Try again.";
            }
        }

        async function loadAdminPanel() {
            const { data, error } = await supabase.from('vegetables').select('*');
            if (error) {
                alert("Error connecting to database.");
                return;
            }

            // Seed initial database items if empty on first load
            if (data.length === 0) {
                const sampleVeg = [
                    { name: 'Potatoes (Aluu)', price_per_kg: 80, image_url: 'https://unsplash.com' },
                    { name: 'Onions (Pyaaz)', price_per_kg: 120, image_url: 'https://unsplash.com' },
                    { name: 'Tomatoes (Tamatar)', price_per_kg: 150, image_url: 'https://unsplash.com' },
                    { name: 'Green Chillies (Hari Mirch)', price_per_kg: 200, image_url: 'https://unsplash.com' }
                ];
                await supabase.from('vegetables').insert(sampleVeg);
                loadAdminPanel();
                return;
            }

            const listContainer = document.getElementById('admin-list');
            listContainer.innerHTML = '';

            data.forEach(veg => {
                const row = document.createElement('div');
                row.className = 'admin-row';
                row.innerHTML = `
                    <span><strong>${veg.name}</strong></span>
                    <div>
                        Rs. <input type="number" id="input-${veg.id}" value="${veg.price_per_kg}" style="width: 70px;"> / kg
                        <button onclick="updatePrice(${veg.id})">Save</button>
                    </div>
                `;
                listContainer.appendChild(row);
            });
        }

        async function updatePrice(id) {
            const newPrice = document.getElementById(`input-${id}`).value;
            const { error } = await supabase
                .from('vegetables')
                .update({ price_per_kg: parseFloat(newPrice) })
                .eq('id', id);

            if (error) {
                alert("Failed to update price.");
            } else {
                alert("Price updated successfully!");
            }
        }
    </script>
</body>
</html>
